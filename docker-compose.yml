services:
  mysql:
    image: mysql:8.0
    container_name: skin_mysql
    restart: unless-stopped
    ports:
      # 로컬 PC 내부에서만 접근 가능하도록 127.0.0.1로 제한
      - "127.0.0.1:3306:3306"
    environment:
      # 값이 비어있으면 컨테이너 실행을 즉시 차단(:? 필수 지정)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - ./mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: skin_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # 비밀번호 없는 무단 접근 차단
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  qdrant:
    image: qdrant/qdrant:latest
    container_name: skin_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      # 벡터 DB API 키 인증 활성화
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    volumes:
      - ./qdrant_data:/qdrant/storage
services:
  mysql:
    image: mysql:8.0
    container_name: mediguide_mysql_full
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mediguide_db
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_fullstack_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediguide_redis_full
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mediguide_qdrant_full
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_fullstack_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mediguide_backend_full
    restart: always
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpassword@mysql:3306/mediguide_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  ai_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mediguide_worker_full
    restart: always
    command: python -m ai_worker.worker
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpassword@mysql:3306/mediguide_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mediguide_frontend_full
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_fullstack_data:
  qdrant_fullstack_data: